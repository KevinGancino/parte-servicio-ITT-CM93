<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat;
}
.page{display:none}
.page.active{display:block}
.input{width:100%;border:1px solid #ccc;padding:8px;border-radius:6px}
label{font-weight:600;font-size:14px}
canvas{touch-action:none}
</style>
</head>

<body class="min-h-screen flex items-center justify-center">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.png" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">
  Parte de Servicio – ITT 1878
</h2>

<form id="form">

<!-- PÁGINA 1 -->
<div class="page active">
  <label>Operario *</label>
  <input name="operario" required class="input">
  <label class="mt-2 block">Vehículo</label>
  <input name="vehiculo" class="input">
  <label class="mt-2 block">Nº OT *</label>
  <input name="ot" required class="input">
  <label class="mt-2 block">Fecha *</label>
  <input type="date" name="fecha" required class="input">
</div>

<!-- PÁGINA 2 -->
<div class="page">
  <label>Cliente *</label>
  <input name="cliente" required class="input">
  <label class="mt-2 block">Dirección</label>
  <input name="direccion" class="input">
  <label class="mt-2 block">Teléfono</label>
  <input name="telefono" class="input">
  <label class="mt-2 block">Email</label>
  <input name="email" class="input">
</div>

<!-- PÁGINA 3 -->
<div class="page">
  <label>Marca *</label>
  <input name="marca" required class="input">
  <label class="mt-2 block">Modelo *</label>
  <input name="modelo" required class="input">
  <label class="mt-2 block">Nº Serie *</label>
  <input name="serie" required class="input">
  <label class="mt-2 block">Horas máquina</label>
  <input name="horas_maquina" class="input">
</div>

<!-- PÁGINA 4 -->
<div class="page">
  <label>Motivo del aviso</label>
  <textarea name="motivo" class="input h-24"></textarea>
  <label class="mt-2 block">Descripción del problema</label>
  <textarea name="problema" class="input h-24"></textarea>
</div>

<!-- PÁGINA 5 -->
<div class="page">
  <label>Hora salida *</label>
  <select name="hora_salida" required class="input"></select>
  <label class="mt-2 block">Hora llegada *</label>
  <select name="hora_llegada" required class="input"></select>
  <label class="mt-2 block">Horas trabajo *</label>
  <input name="horas_trabajo" required class="input">
  <label class="mt-2 block">Kilómetros *</label>
  <input name="km" required class="input">
</div>

<!-- PÁGINA 6 -->
<div class="page">
  <label>Trabajos realizados</label>
  <textarea name="trabajos" class="input h-24"></textarea>
  <label class="mt-2 block">Materiales utilizados</label>
  <textarea name="materiales" class="input h-24"></textarea>
  <label class="mt-2 block">Observaciones</label>
  <textarea name="observaciones" class="input h-24"></textarea>
</div>

<!-- PÁGINA 7 -->
<div class="page">
  <label>Firma operario</label>
  <canvas id="firmaOperario" class="border w-full h-32 mb-4"></canvas>
  <label>Firma cliente</label>
  <canvas id="firmaCliente" class="border w-full h-32"></canvas>
  <button type="button" onclick="finalizar()" class="w-full mt-4 bg-black text-white py-2 rounded">
    Generar PDF y Enviar
  </button>
</div>

<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

const pages=document.querySelectorAll(".page");
let i=0;
function show(){pages.forEach(p=>p.classList.remove("active"));pages[i].classList.add("active")}
function next(){
  const inputs=pages[i].querySelectorAll("[required]");
  for(let inp of inputs){if(!inp.value){alert("Completa los campos obligatorios");return;}}
  if(i<pages.length-1){i++;show();}
}
function prev(){if(i>0){i--;show();}}

function buildHours(){
  let html="";
  for(let h=6;h<=20;h++){
    for(let m of [0,15,30,45]){
      if(h===20 && m>0) continue;
      html+=`<option>${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}</option>`;
    }
  }
  document.querySelectorAll("select").forEach(s=>s.innerHTML=html);
}
buildHours();

// FIRMAS (mouse + táctil)
function firma(canvas){
  const ctx=canvas.getContext("2d");
  let draw=false;
  canvas.addEventListener("pointerdown",e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});
  canvas.addEventListener("pointermove",e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}});
  canvas.addEventListener("pointerup",()=>draw=false);
}
const firmaOperario=document.getElementById("firmaOperario");
const firmaCliente=document.getElementById("firmaCliente");
firma(firmaOperario);
firma(firmaCliente);

// PDF + EMAIL
function finalizar(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  pdf.addImage("assets/logos/logo-itt-1878.png","PNG",10,5,40,15);
  pdf.addImage("assets/logos/logo-itt-cm93.png","PNG",55,7,20,10);
  pdf.addImage("assets/logos/logo-case.png","PNG",80,7,30,10);
  pdf.addImage("assets/logos/logo-manitou.png","PNG",120,7,30,10);

  pdf.text("PARTE DE SERVICIO – ITT 1878",60,25);

  let y=35;
  const data=new FormData(form);
  data.forEach((v,k)=>{
    pdf.text(k.toUpperCase()+":",10,y);
    pdf.rect(40,y-5,160,7);
    pdf.text(v||"",42,y);
    y+=9;
  });

  pdf.text("Firma operario",10,y);
  pdf.addImage(firmaOperario.toDataURL(),"PNG",10,y+2,80,25);
  pdf.text("Firma cliente",110,y);
  pdf.addImage(firmaCliente.toDataURL(),"PNG",110,y+2,80,25);

  const base64=pdf.output("datauristring").split(",")[1];

  emailjs.send("service_k44yx7g","template_6i0hl7v",{
    to_email:"kevin.gancino@cm93.com",
    filename:"parte-servicio-ITT1878.pdf",
    pdf_base64:base64
  }).then(()=>{
    pdf.save("parte-servicio-ITT1878.pdf");
    alert("Parte enviado correctamente");
  }).catch(e=>{
    console.error(e);
    alert("Error enviando el email");
  });
}
</script>

</body>
</html>
