<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Parte de Servicio – ITT 1878</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    body {
      background: url("assets/bg/workshop.jpg") no-repeat center center fixed;
      background-size: cover;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center">

  <div class="bg-white/95 w-full max-w-xl rounded-xl shadow-xl p-6">

    <!-- LOGOS -->
    <div class="text-center mb-4">
      <img src="assets/logos/logo-itt-1878.png" class="mx-auto h-16 mb-3" />
      <div class="flex justify-center gap-4">
        <img src="assets/logos/logo-itt-cm93.png" class="h-10" />
        <img src="assets/logos/logo-case.jfif" class="h-10" />
        <img src="assets/logos/logo-manitou.png" class="h-10" />
      </div>
    </div>

    <h2 class="text-center text-xl font-bold mb-4">Parte de Servicio – ITT 1878</h2>

    <!-- FORMULARIO -->
    <form id="parteForm" class="space-y-3">

      <input id="operario" class="w-full border rounded p-2" placeholder="Operario *" required />
      <input id="vehiculo" class="w-full border rounded p-2" placeholder="Vehículo" />
      <input id="ot" class="w-full border rounded p-2" placeholder="Nº OT *" required />
      <input id="fecha" type="date" class="w-full border rounded p-2" required />

      <textarea id="trabajos" class="w-full border rounded p-2" rows="4"
        placeholder="Descripción de trabajos realizados"></textarea>

      <input id="horas" class="w-full border rounded p-2" placeholder="Horas mano de obra" />
      <input id="km" class="w-full border rounded p-2" placeholder="Kilómetros realizados" />

      <!-- FIRMA -->
      <p class="text-sm font-semibold mt-4">Firma del operario</p>
      <canvas id="firma" class="border w-full h-32"></canvas>
      <button type="button" onclick="limpiarFirma()" class="text-sm text-blue-600">Limpiar firma</button>

      <button type="submit"
        class="w-full bg-black text-white py-2 rounded font-semibold mt-4">
        Finalizar y enviar
      </button>
    </form>
  </div>

<script>
/* ================= EMAILJS INIT ================= */
emailjs.init("YUPi8RN6-nphAC3p-");

/* ================= FIRMA ================= */
const canvas = document.getElementById("firma");
const ctx = canvas.getContext("2d");
let dibujando = false;

canvas.addEventListener("mousedown", () => dibujando = true);
canvas.addEventListener("mouseup", () => dibujando = false);
canvas.addEventListener("mousemove", e => {
  if (!dibujando) return;
  ctx.lineWidth = 2;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
});

function limpiarFirma() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ================= FORM SUBMIT ================= */
document.getElementById("parteForm").addEventListener("submit", async e => {
  e.preventDefault();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  /* LOGOS PDF */
  const logoITT = await cargarImg("assets/logos/logo-itt-1878.png");
  const logoCM = await cargarImg("assets/logos/logo-itt-cm93.png");

  pdf.addImage(logoITT, "PNG", 80, 5, 50, 20);
  pdf.addImage(logoCM, "PNG", 10, 5, 30, 15);

  pdf.setFontSize(14);
  pdf.text("PARTE DE SERVICIO – ITT 1878", 105, 35, { align: "center" });

  pdf.setFontSize(10);
  let y = 50;

  const campo = (label, value) => {
    pdf.text(`${label}: ${value}`, 15, y);
    y += 8;
  };

  campo("Operario", operario.value);
  campo("Vehículo", vehiculo.value);
  campo("Nº OT", ot.value);
  campo("Fecha", fecha.value);
  campo("Horas MO", horas.value);
  campo("Kilómetros", km.value);

  y += 5;
  pdf.text("Trabajos realizados:", 15, y);
  y += 6;
  pdf.text(trabajos.value || "-", 15, y, { maxWidth: 180 });

  /* FIRMA PDF */
  const firmaImg = canvas.toDataURL("image/png");
  pdf.addImage(firmaImg, "PNG", 15, 220, 60, 25);
  pdf.text("Firma operario", 15, 215);

  /* BASE64 */
  const pdfBase64 = pdf.output("datauristring").split(",")[1];

  /* EMAILJS */
  emailjs.send("service_k44yx7g", "template_6i0hl7v", {
    to_email: "kevin.gancino@cm93.com",
    operario: operario.value,
    ot: ot.value,
    pdf_base64: pdfBase64
  }).then(() => {
    alert("Parte enviado correctamente");
    location.reload();
  }).catch(err => {
    alert("Error al enviar el parte");
    console.error(err);
  });
});

/* ================= UTIL ================= */
function cargarImg(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = src;
  });
}
</script>

</body>
</html>
