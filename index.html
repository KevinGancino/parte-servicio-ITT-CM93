<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat
}
.page{display:none}
.page.active{display:block}
.input{
  width:100%;
  border:1px solid #ccc;
  padding:8px;
  border-radius:6px;
}
</style>
</head>

<body class="min-h-screen flex justify-center items-center">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.jfif" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">
  Parte de Servicio – ITT 1878
</h2>

<form id="form">

<!-- 1. OPERARIO -->
<div class="page active">
  <input name="operario" placeholder="Operario *" class="input">
  <input name="vehiculo" placeholder="Vehículo" class="input mt-2">
  <input name="ot" placeholder="Nº OT *" class="input mt-2">
  <input type="date" name="fecha" class="input mt-2">
</div>

<!-- 2. CLIENTE -->
<div class="page">
  <input name="cliente" placeholder="Cliente *" class="input">
  <input name="direccion" placeholder="Dirección" class="input mt-2">
  <input name="telefono" placeholder="Teléfono" class="input mt-2">
  <input name="email_cliente" placeholder="Email cliente" class="input mt-2">
</div>

<!-- 3. MAQUINA -->
<div class="page">
  <input name="marca" placeholder="Marca" class="input">
  <input name="modelo" placeholder="Modelo" class="input mt-2">
  <input name="serie" placeholder="Nº Serie" class="input mt-2">
  <input name="horas_maquina" placeholder="Horas máquina" class="input mt-2">
</div>

<!-- 4. PROBLEMA -->
<div class="page">
  <textarea name="problema" placeholder="Descripción del problema" class="input h-32"></textarea>
</div>

<!-- 5. MANO DE OBRA -->
<div class="page">
  <input name="h_salida" placeholder="Hora salida" class="input">
  <input name="h_llegada" placeholder="Hora llegada" class="input mt-2">
  <input name="inicio" placeholder="Inicio trabajos" class="input mt-2">
  <input name="fin" placeholder="Fin trabajos" class="input mt-2">
  <input name="horas" placeholder="Horas mano de obra" class="input mt-2">
  <input name="km" placeholder="Kilómetros realizados" class="input mt-2">
</div>

<!-- 6. TRABAJOS -->
<div class="page">
  <textarea name="trabajos" placeholder="Trabajos efectuados" class="input h-28"></textarea>
  <textarea name="materiales" placeholder="Materiales utilizados" class="input h-24 mt-2"></textarea>
  <textarea name="observaciones" placeholder="Observaciones" class="input h-24 mt-2"></textarea>
</div>

<!-- 7. FIRMAS -->
<div class="page">
  <p class="font-semibold mb-1">Firma operario</p>
  <canvas id="firma" class="border w-full h-32 mb-4"></canvas>

  <button type="button" onclick="finalizar()" class="w-full bg-black text-white py-2 rounded">
    Generar PDF y Enviar Parte
  </button>
</div>

<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

const pages=document.querySelectorAll('.page');
let i=0;
function show(){pages.forEach(p=>p.classList.remove('active'));pages[i].classList.add('active')}
function next(){if(i<pages.length-1){i++;show()}}
function prev(){if(i>0){i--;show()}}

const canvas=document.getElementById('firma');
const ctx=canvas.getContext('2d');
let draw=false;
canvas.onmousedown=()=>{draw=true;ctx.beginPath()}
canvas.onmouseup=()=>draw=false;
canvas.onmousemove=e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}}

function finalizar(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  pdf.addImage("assets/logos/logo-itt-1878.png","PNG",70,5,60,20);
  pdf.setFontSize(12);
  pdf.text("PARTE DE SERVICIO – ITT 1878",105,30,{align:"center"});

  let y=40;
  const f=new FormData(document.getElementById("form"));
  const row=(l,v)=>{pdf.text(`${l}: ${v||"-"}`,10,y);y+=7};

  [
    ["Operario",f.get("operario")],
    ["Vehículo",f.get("vehiculo")],
    ["OT",f.get("ot")],
    ["Fecha",f.get("fecha")],
    ["Cliente",f.get("cliente")],
    ["Marca",f.get("marca")],
    ["Modelo",f.get("modelo")],
    ["Horas MO",f.get("horas")],
    ["KM",f.get("km")]
  ].forEach(r=>row(r[0],r[1]));

  pdf.text("Trabajos:",10,y+=5);
  pdf.text(f.get("trabajos")||"-",10,y+=6,{maxWidth:190});

  pdf.addImage(canvas.toDataURL(),"PNG",10,240,60,30);

  const base64=pdf.output("datauristring").split(",")[1];

  emailjs.send("service_k44yx7g","template_6i0hl7v",{
    to_email:"kevin.gancino@cm93.com",
    pdf_base64:base64,
    ot:f.get("ot")
  });

  pdf.save("parte-servicio.pdf");
  alert("Parte enviado correctamente");
}
</script>

</body>
</html>
