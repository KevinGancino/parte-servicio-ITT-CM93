<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat;
}
.page{display:none}
.page.active{display:block}
canvas{touch-action:none}
</style>
</head>

<body class="min-h-screen flex justify-center items-center p-4">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.png?v=2" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">Parte de Servicio – ITT 1878</h2>

<form id="form">

<!-- PAGE 1 -->
<div class="page active">
  <label class="font-semibold">Operario *</label>
  <input name="operario" class="input">

  <label class="font-semibold mt-2 block">Vehículo</label>
  <input name="vehiculo" class="input">

  <label class="font-semibold mt-2 block">Nº OT *</label>
  <input name="ot" class="input">

  <label class="font-semibold mt-2 block">Fecha *</label>
  <input type="date" name="fecha" class="input">
</div>

<!-- PAGE 2 -->
<div class="page">
  <label class="font-semibold">Cliente *</label>
  <input name="cliente" class="input">

  <label class="font-semibold mt-2 block">Dirección</label>
  <input name="direccion" class="input">

  <label class="font-semibold mt-2 block">Teléfono</label>
  <input name="telefono" class="input">

  <label class="font-semibold mt-2 block">Email</label>
  <input name="email" class="input">
</div>

<!-- PAGE 3 -->
<div class="page">
  <label class="font-semibold">Marca *</label>
  <input name="marca" class="input">

  <label class="font-semibold mt-2 block">Modelo *</label>
  <input name="modelo" class="input">

  <label class="font-semibold mt-2 block">Nº Serie *</label>
  <input name="serie" class="input">

  <label class="font-semibold mt-2 block">Horas máquina</label>
  <input name="horas_maquina" class="input">
</div>

<!-- PAGE 4 -->
<div class="page">
  <label class="font-semibold">Motivo del aviso</label>
  <textarea name="motivo" class="input h-24"></textarea>

  <label class="font-semibold mt-2 block">Descripción del problema</label>
  <textarea name="problema" class="input h-24"></textarea>
</div>

<!-- PAGE 5 -->
<div class="page">
  <label class="font-semibold">Hora salida *</label>
  <select name="hora_salida" class="input"></select>

  <label class="font-semibold mt-2 block">Hora llegada *</label>
  <select name="hora_llegada" class="input"></select>

  <label class="font-semibold mt-2 block">Horas trabajo *</label>
  <input name="horas_trabajo" class="input">

  <label class="font-semibold mt-2 block">Kilómetros realizados *</label>
  <input name="km" class="input">
</div>

<!-- PAGE 6 -->
<div class="page">
  <label class="font-semibold">Trabajos realizados</label>
  <textarea name="trabajos" class="input h-24"></textarea>

  <label class="font-semibold mt-2 block">Materiales utilizados</label>
  <textarea name="materiales" class="input h-24"></textarea>

  <label class="font-semibold mt-2 block">Observaciones</label>
  <textarea name="observaciones" class="input h-24"></textarea>
</div>

<!-- PAGE 7 -->
<div class="page">
  <p class="font-semibold mb-1">Firma operario</p>
  <canvas id="firma_operario" class="border w-full h-32 mb-4"></canvas>

  <p class="font-semibold mb-1">Firma cliente</p>
  <canvas id="firma_cliente" class="border w-full h-32 mb-4"></canvas>

  <button type="button" onclick="finalizar()" class="w-full bg-black text-white py-3 rounded">
    Generar PDF y Enviar
  </button>
</div>

<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

const pages=document.querySelectorAll('.page');
let i=0;
function show(){pages.forEach(p=>p.classList.remove('active'));pages[i].classList.add('active')}
function next(){if(i<pages.length-1){i++;show()}}
function prev(){if(i>0){i--;show()}}

// Horarios cada 15 minutos
function fillTimes(sel){
  for(let h=6;h<=20;h++){
    for(let m=0;m<60;m+=15){
      if(h===20 && m>0) continue;
      sel.add(new Option(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`));
    }
  }
}
fillTimes(document.querySelector('[name=hora_salida]'));
fillTimes(document.querySelector('[name=hora_llegada]'));

// Firmas
function firma(canvas){
  const ctx=canvas.getContext("2d");
  let draw=false;
  const pos=e=>e.touches?e.touches[0]:e;
  canvas.addEventListener("mousedown",()=>draw=true);
  canvas.addEventListener("mouseup",()=>{draw=false;ctx.beginPath()});
  canvas.addEventListener("mousemove",e=>{
    if(!draw)return;
    ctx.lineWidth=2;
    ctx.lineTo(pos(e).offsetX,pos(e).offsetY);
    ctx.stroke();
  });
  canvas.addEventListener("touchstart",()=>draw=true);
  canvas.addEventListener("touchend",()=>{draw=false;ctx.beginPath()});
  canvas.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(!draw)return;
    const r=canvas.getBoundingClientRect();
    ctx.lineTo(pos(e).clientX-r.left,pos(e).clientY-r.top);
    ctx.stroke();
  });
}
firma(document.getElementById("firma_operario"));
firma(document.getElementById("firma_cliente"));

// PDF + Email
async function loadImage(src){
  return new Promise(r=>{
    const i=new Image();i.crossOrigin="anonymous";
    i.onload=()=>{const c=document.createElement("canvas");c.width=i.width;c.height=i.height;c.getContext("2d").drawImage(i,0,0);r(c.toDataURL())};
    i.src=src;
  });
}

async function finalizar(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  const logoITT=await loadImage("assets/logos/logo-itt-1878.png");
  const logoCASE=await loadImage("assets/logos/logo-case.png?v=2");
  const logoMAN=await loadImage("assets/logos/logo-manitou.png");

  pdf.addImage(logoITT,"PNG",10,5,40,15);
  pdf.addImage(logoCASE,"PNG",60,5,40,15);
  pdf.addImage(logoMAN,"PNG",110,5,40,15);

  pdf.setFontSize(14);
  pdf.text("PARTE DE SERVICIO – ITT 1878",10,30);

  let y=40;
  new FormData(form).forEach((v,k)=>{pdf.setFontSize(10);pdf.text(`${k}: ${v}`,10,y);y+=6});

  pdf.text("Firma operario:",10,y+5);
  pdf.addImage(firma_operario.toDataURL(),"PNG",10,y+10,60,25);

  pdf.text("Firma cliente:",80,y+5);
  pdf.addImage(firma_cliente.toDataURL(),"PNG",80,y+10,60,25);

  const blob=pdf.output("blob");

  emailjs.send("service_k44yx7g","template_6i0hl7v",{to_email:"kevin.gancino@cm93.com"},{attachments:[{name:"parte-servicio.pdf",blob}]});

  pdf.save("parte-servicio.pdf");
  alert("Parte generado y enviado correctamente");
}
</script>

<style>
.input{
  width:100%;
  border:1px solid #ccc;
  padding:8px;
  border-radius:6px;
}
</style>

</body>
</html>
