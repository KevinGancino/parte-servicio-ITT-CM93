<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat;
}
.page{display:none}
.page.active{display:block}
.input{width:100%;border:1px solid #ccc;padding:8px;border-radius:6px}
label{font-weight:600;font-size:14px}
canvas{touch-action:none}
</style>
</head>

<body class="min-h-screen flex justify-center items-center p-4">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.png" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">Parte de Servicio – ITT 1878</h2>

<form id="form">

<!-- PAGE 1 -->
<div class="page active" data-required="operario,ot,fecha,vehiculo">
<label>Operario *</label>
<input name="operario" class="input">

<label class="mt-2">Vehículo *</label>
<input name="vehiculo" class="input">

<label class="mt-2">Nº OT *</label>
<input name="ot" class="input">

<label class="mt-2">Fecha *</label>
<input type="date" name="fecha" class="input">
</div>

<!-- PAGE 2 -->
<div class="page" data-required="cliente">
<label>Cliente *</label>
<input name="cliente" class="input">

<label class="mt-2">Dirección</label>
<input name="direccion" class="input">

<label class="mt-2">Teléfono</label>
<input name="telefono" class="input">

<label class="mt-2">Email</label>
<input name="email" class="input">
</div>

<!-- PAGE 3 -->
<div class="page" data-required="marca,modelo,serie">
<label>Marca *</label>
<input name="marca" class="input">

<label class="mt-2">Modelo *</label>
<input name="modelo" class="input">

<label class="mt-2">Nº Serie *</label>
<input name="serie" class="input">

<label class="mt-2">Horas máquina</label>
<input name="horas_maquina" class="input">
</div>

<!-- PAGE 4 -->
<div class="page" data-required="motivo,problema">
<label>Motivo del aviso *</label>
<input name="motivo" class="input">

<label class="mt-2">Descripción del problema *</label>
<textarea name="problema" class="input h-24"></textarea>
</div>

<!-- PAGE 5 -->
<div class="page" data-required="hora_salida,hora_llegada,horas_trabajo,km">
<label>Hora salida *</label>
<select name="hora_salida" class="input"></select>

<label class="mt-2">Hora llegada *</label>
<select name="hora_llegada" class="input"></select>

<label class="mt-2">Horas trabajo *</label>
<input name="horas_trabajo" class="input">

<label class="mt-2">Kilómetros realizados *</label>
<input name="km" class="input">
</div>

<!-- PAGE 6 -->
<div class="page">
<label>Trabajos realizados</label>
<textarea name="trabajos" class="input h-24"></textarea>

<label class="mt-2">Materiales utilizados</label>
<textarea name="materiales" class="input h-24"></textarea>

<label class="mt-2">Observaciones</label>
<textarea name="observaciones" class="input h-24"></textarea>
</div>

<!-- PAGE 7 -->
<div class="page">
<label>Firma operario</label>
<canvas id="firmaOperario" class="border w-full h-32"></canvas>

<label class="mt-2">Firma cliente</label>
<canvas id="firmaCliente" class="border w-full h-32"></canvas>

<button type="button" onclick="finalizar()" class="w-full bg-black text-white py-3 rounded mt-4">
Generar PDF y Enviar
</button>
</div>

<div class="flex justify-between mt-4">
<button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
<button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

const pages=document.querySelectorAll('.page');
let i=0;

function show(){
 pages.forEach(p=>p.classList.remove('active'));
 pages[i].classList.add('active');
}

function validate(){
 const req=pages[i].dataset.required;
 if(!req) return true;
 for(const name of req.split(',')){
   const el=document.querySelector(`[name="${name}"]`);
   if(!el || !el.value){
     alert("Completa todos los campos obligatorios");
     return false;
   }
 }
 return true;
}

function next(){ if(validate() && i<pages.length-1){i++;show()} }
function prev(){ if(i>0){i--;show()} }

// HORAS 06:00–20:00 en cuartos
function fillHours(sel){
 for(let h=6;h<=20;h++){
  for(let m of [0,15,30,45]){
   if(h===20 && m>0) continue;
   const t=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
   sel.innerHTML+=`<option>${t}</option>`;
  }
 }
}
fillHours(document.querySelector('[name="hora_salida"]'));
fillHours(document.querySelector('[name="hora_llegada"]'));

// FIRMA
function setupCanvas(c){
 const ctx=c.getContext('2d'); let d=false;
 const pos=e=>e.touches?e.touches[0]:e;
 c.addEventListener('mousedown',()=>d=true);
 c.addEventListener('mouseup',()=>{d=false;ctx.beginPath()});
 c.addEventListener('mousemove',e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}});
 c.addEventListener('touchstart',e=>{d=true;const p=pos(e);ctx.moveTo(p.clientX-c.offsetLeft,p.clientY-c.offsetTop)});
 c.addEventListener('touchend',()=>{d=false;ctx.beginPath()});
 c.addEventListener('touchmove',e=>{if(d){e.preventDefault();const p=pos(e);ctx.lineTo(p.clientX-c.offsetLeft,p.clientY-c.offsetTop);ctx.stroke()}});
}
setupCanvas(firmaOperario);
setupCanvas(firmaCliente);

// FINALIZAR
function finalizar(){
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF();
 pdf.addImage("assets/logos/logo-itt-1878.png","PNG",10,5,40,15);
 pdf.text("PARTE DE SERVICIO – ITT 1878",60,15);

 let y=30;
 new FormData(form).forEach((v,k)=>{
  pdf.text(`${k}: ${v}`,10,y); y+=7;
 });

 pdf.addImage(firmaOperario.toDataURL(),"PNG",10,y,60,30);
 pdf.addImage(firmaCliente.toDataURL(),"PNG",80,y,60,30);

 const base64=pdf.output("datauristring").split(',')[1];

 emailjs.send("service_k44yx7g","template_6i0hl7v",{
   to_email:"kevin.gancino@cm93.com",
   pdf_base64:base64
 });

 pdf.save("parte-servicio.pdf");
 alert("Parte enviado correctamente");
}
</script>

</body>
</html>
