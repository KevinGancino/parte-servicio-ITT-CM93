<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat;
}
.page{display:none}
.page.active{display:block}
.input{
  width:100%;
  border:1px solid #ccc;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body class="min-h-screen flex justify-center items-center">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.jfif" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">Parte de Servicio – ITT 1878</h2>

<form id="form">

<!-- PAGE 1 -->
<div class="page active">
  <input name="operario" placeholder="Operario *" class="input mb-2">
  <input name="vehiculo" placeholder="Vehículo" class="input mb-2">
  <input name="ot" placeholder="Nº OT *" class="input mb-2">
  <input type="date" name="fecha" class="input">
</div>

<!-- PAGE 2 -->
<div class="page">
  <input name="cliente" placeholder="Cliente *" class="input mb-2">
  <input name="telefono" placeholder="Teléfono" class="input mb-2">
  <input name="email" placeholder="Email" class="input">
</div>

<!-- PAGE 3 -->
<div class="page">
  <input name="marca" placeholder="Marca máquina *" class="input mb-2">
  <input name="modelo" placeholder="Modelo *" class="input mb-2">
  <input name="serie" placeholder="Nº Serie *" class="input">
</div>

<!-- PAGE 4 -->
<div class="page">
  <textarea name="problema" placeholder="Descripción del problema *" class="input h-32"></textarea>
</div>

<!-- PAGE 5 -->
<div class="page">
  <input name="h_salida" placeholder="Hora salida" class="input mb-2">
  <input name="h_llegada" placeholder="Hora llegada" class="input mb-2">
  <input name="horas" placeholder="Horas mano de obra *" class="input mb-2">
  <input name="km" placeholder="Kilómetros realizados" class="input">
</div>

<!-- PAGE 6 -->
<div class="page">
  <textarea name="trabajos" placeholder="Trabajos realizados" class="input h-24 mb-2"></textarea>
  <textarea name="materiales" placeholder="Materiales utilizados" class="input h-24 mb-2"></textarea>
  <textarea name="observaciones" placeholder="Observaciones" class="input h-24"></textarea>
</div>

<!-- PAGE 7 -->
<div class="page">
  <p class="font-semibold mb-2">Firma del operario</p>
  <canvas id="firma" class="border w-full h-32 mb-4"></canvas>

  <button type="button" onclick="finalizar()"
    class="w-full bg-black text-white py-3 rounded">
    Generar PDF y Enviar
  </button>
</div>

<!-- NAV -->
<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">
    Atrás
  </button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">
    Siguiente
  </button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

const pages = document.querySelectorAll('.page');
let current = 0;

function showPage(){
  pages.forEach(p => p.classList.remove('active'));
  pages[current].classList.add('active');
}

function next(){
  if(current < pages.length-1){
    current++;
    showPage();
  }
}

function prev(){
  if(current > 0){
    current--;
    showPage();
  }
}

showPage();

// FIRMA
const canvas = document.getElementById('firma');
const ctx = canvas.getContext('2d');
let drawing=false;

canvas.onmousedown=()=>{drawing=true;ctx.beginPath()};
canvas.onmouseup=()=>drawing=false;
canvas.onmousemove=e=>{
  if(!drawing) return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
};

// PDF + EMAIL
function finalizar(){
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF();

  pdf.text("PARTE DE SERVICIO – ITT 1878", 10, 10);

  let y=20;
  const data = new FormData(document.getElementById("form"));
  data.forEach((v,k)=>{
    pdf.text(`${k.toUpperCase()}: ${v}`,10,y);
    y+=7;
  });

  pdf.addImage(canvas.toDataURL(),"PNG",10,y,60,30);

  const pdfBase64 = pdf.output("datauristring").split(",")[1];

  emailjs.send("service_k44yx7g","template_6i0hl7v",{
    operario:data.get("operario"),
    cliente:data.get("cliente"),
    ot:data.get("ot"),
    vehiculo:data.get("vehiculo"),
    fecha:data.get("fecha"),
    horas:data.get("horas"),
    km:data.get("km"),
    descripcion:data.get("trabajos"),
    pdf_base64:pdfBase64
  });

  pdf.save("parte-servicio.pdf");
  alert("Parte enviado correctamente");
}
</script>

</body>
</html>
