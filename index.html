<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat}
.page{display:none}
.page.active{display:block}
canvas{touch-action:none}
</style>
</head>

<body class="min-h-screen flex justify-center items-center p-2">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.png" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">Parte de Servicio – ITT 1878</h2>

<form id="form">

<!-- PÁGINA 1 -->
<div class="page active">
  <label>Operario *</label>
  <input name="operario" required class="input">

  <label class="mt-2 block">Nº OT *</label>
  <input name="ot" required class="input">

  <label class="mt-2 block">Fecha *</label>
  <input type="date" name="fecha" required class="input">

  <label class="mt-2 block">Vehículo</label>
  <input name="vehiculo" class="input">
</div>

<!-- PÁGINA 2 -->
<div class="page">
  <label>Cliente *</label>
  <input name="cliente" required class="input">

  <label class="mt-2 block">Dirección</label>
  <input name="direccion" class="input">

  <label class="mt-2 block">Teléfono</label>
  <input name="telefono" class="input">

  <label class="mt-2 block">Email</label>
  <input name="email" class="input">
</div>

<!-- PÁGINA 3 -->
<div class="page">
  <label>Marca *</label>
  <input name="marca" required class="input">

  <label class="mt-2 block">Modelo *</label>
  <input name="modelo" required class="input">

  <label class="mt-2 block">Nº Serie *</label>
  <input name="serie" required class="input">

  <label class="mt-2 block">Horas máquina</label>
  <input name="horas_maquina" class="input">
</div>

<!-- PÁGINA 4 -->
<div class="page">
  <label>Motivo del aviso</label>
  <textarea name="motivo" class="input h-24"></textarea>

  <label class="mt-2 block">Descripción del problema</label>
  <textarea name="problema" class="input h-28"></textarea>
</div>

<!-- PÁGINA 5 -->
<div class="page">
  <label>Hora salida *</label>
  <select name="hora_salida" required class="input"></select>

  <label class="mt-2 block">Hora llegada *</label>
  <select name="hora_llegada" required class="input"></select>

  <label class="mt-2 block">Horas trabajo *</label>
  <input name="horas_trabajo" required class="input">

  <label class="mt-2 block">Kilómetros *</label>
  <input name="km" required class="input">
</div>

<!-- PÁGINA 6 -->
<div class="page">
  <label>Trabajos realizados</label>
  <textarea name="trabajos" class="input h-28"></textarea>

  <label class="mt-2 block">Materiales utilizados</label>
  <textarea name="materiales" class="input h-24"></textarea>

  <label class="mt-2 block">Observaciones</label>
  <textarea name="observaciones" class="input h-24"></textarea>
</div>

<!-- PÁGINA 7 -->
<div class="page">
  <label class="font-semibold">Firma operario</label>
  <canvas id="firmaOperario" class="border w-full h-32 mb-4"></canvas>

  <label class="font-semibold">Firma cliente</label>
  <canvas id="firmaCliente" class="border w-full h-32 mb-4"></canvas>

  <button type="button" onclick="finalizar()" class="w-full bg-black text-white py-3 rounded">
    Generar PDF y Enviar
  </button>
</div>

<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

/* PÁGINAS */
const pages=document.querySelectorAll('.page');
let i=0;
function show(){pages.forEach(p=>p.classList.remove('active'));pages[i].classList.add('active')}
function next(){
  const req=pages[i].querySelectorAll('[required]');
  for(const f of req){if(!f.value){alert("Completa los campos obligatorios");return}}
  if(i<pages.length-1){i++;show()}
}
function prev(){if(i>0){i--;show()}}

/* HORAS CADA 15 MIN */
function fillHours(sel){
  for(let h=6;h<=20;h++){
    for(let m=0;m<60;m+=15){
      const v=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      sel.innerHTML+=`<option>${v}</option>`;
    }
  }
}
fillHours(document.querySelector('[name=hora_salida]'));
fillHours(document.querySelector('[name=hora_llegada]'));

/* FIRMA */
function setupCanvas(id){
  const c=document.getElementById(id),ctx=c.getContext("2d");
  let draw=false;
  const pos=e=>e.touches?e.touches[0]:e;
  c.addEventListener("mousedown",()=>draw=true);
  c.addEventListener("mouseup",()=>{draw=false;ctx.beginPath()});
  c.addEventListener("mousemove",e=>{if(!draw)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()});
  c.addEventListener("touchstart",e=>{draw=true;const p=pos(e);ctx.moveTo(p.clientX-c.offsetLeft,p.clientY-c.offsetTop)});
  c.addEventListener("touchend",()=>{draw=false;ctx.beginPath()});
  c.addEventListener("touchmove",e=>{if(!draw)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.clientX-c.offsetLeft,p.clientY-c.offsetTop);ctx.stroke()});
}
setupCanvas("firmaOperario");
setupCanvas("firmaCliente");

/* PDF + EMAIL */
function finalizar(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");
  const d=Object.fromEntries(new FormData(form));

  pdf.addImage("assets/logos/logo-itt-1878.png","PNG",10,8,40,15);
  pdf.addImage("assets/logos/logo-itt-cm93.png","PNG",55,10,20,10);
  pdf.addImage("assets/logos/logo-case.png","PNG",80,10,30,10);
  pdf.addImage("assets/logos/logo-manitou.png","PNG",120,10,30,10);
  pdf.text("PARTE DE SERVICIO – ITT 1878",105,30,{align:"center"});

  let y=36;
  function box(t,v,x,y,w,h){
    pdf.rect(x,y,w,h);
    pdf.setFontSize(8);pdf.text(t,x+2,y+4);
    pdf.setFontSize(10);pdf.text(v||"",x+2,y+10,{maxWidth:w-4});
  }

  box("OPERARIO",d.operario,10,y,60,16);
  box("OT",d.ot,75,y,40,16);
  box("FECHA",d.fecha,120,y,40,16);
  y+=18;

  box("CLIENTE",d.cliente,10,y,95,16);
  box("TELÉFONO",d.telefono,110,y,50,16);
  y+=18;

  box("MARCA",d.marca,10,y,50,16);
  box("MODELO",d.modelo,65,y,50,16);
  box("SERIE",d.serie,120,y,40,16);
  y+=20;

  box("TRABAJOS",d.trabajos,10,y,190,30);
  y+=32;
  box("MATERIALES",d.materiales,10,y,190,24);
  y+=26;
  box("OBSERVACIONES",d.observaciones,10,y,190,20);

  y+=26;
  pdf.text("FIRMA OPERARIO",30,y);
  pdf.rect(10,y+2,70,25);
  pdf.addImage(firmaOperario.toDataURL(),"PNG",12,y+4,66,21);

  pdf.text("FIRMA CLIENTE",140,y);
  pdf.rect(120,y+2,70,25);
  pdf.addImage(firmaCliente.toDataURL(),"PNG",122,y+4,66,21);

  const b64=pdf.output("datauristring").split(",")[1];

  emailjs.send("service_k44yx7g","template_6i0hl7v",{
    to_email:"kevin.gancino@cm93.com",
    filename:"parte-servicio-ITT-1878.pdf",
    pdf_base64:b64
  });

  pdf.save("parte-servicio-ITT-1878.pdf");
  alert("Parte enviado correctamente");
}
</script>

<style>
.input{width:100%;border:1px solid #ccc;padding:8px;border-radius:6px}
</style>

</body>
</html>
