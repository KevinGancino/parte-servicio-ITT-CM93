<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat
}
.page{display:none}
.page.active{display:block}
.input{
  width:100%;
  border:1px solid #ccc;
  padding:8px;
  border-radius:6px;
}
</style>
</head>

<body class="min-h-screen flex justify-center items-center">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.jfif" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">
  Parte de Servicio – ITT 1878
</h2>

<form id="form">

<!-- PÁGINA 1 -->
<div class="page active">
  <input name="operario" placeholder="Operario *" class="input">
  <input name="vehiculo" placeholder="Vehículo" class="input mt-2">
  <input name="ot" placeholder="Nº OT *" class="input mt-2">
  <input type="date" name="fecha" class="input mt-2">
</div>

<!-- PÁGINA 2 -->
<div class="page">
  <textarea name="trabajo" placeholder="Trabajo realizado" class="input h-28"></textarea>
</div>

<!-- PÁGINA 3 -->
<div class="page">
  <input name="horas" type="number" step="0.1" placeholder="Horas mano de obra" class="input">
  <input name="km" type="number" placeholder="Kilómetros realizados" class="input mt-2">
</div>

<!-- PÁGINA 4 -->
<div class="page">
  <textarea name="materiales" placeholder="Materiales utilizados" class="input h-24"></textarea>
  <textarea name="obs" placeholder="Observaciones" class="input h-24 mt-2"></textarea>
</div>

<!-- PÁGINA 5 -->
<div class="page">
  <p class="font-semibold mb-1">Firma del operario</p>
  <canvas id="firma" class="border w-full h-32"></canvas>
</div>

<!-- PÁGINA FINAL -->
<div class="page">
  <button type="button" onclick="finalizar()" class="w-full bg-black text-white py-2 rounded">
    Generar PDF y Enviar
  </button>
</div>

<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
/* ================= EMAILJS ================= */
emailjs.init("YUPi8RN6-nphAC3p-");

/* ================= PAGINACIÓN ================= */
const pages=document.querySelectorAll('.page');
let i=0;
function show(){
  pages.forEach(p=>p.classList.remove('active'));
  pages[i].classList.add('active');
}
function next(){ if(i<pages.length-1){i++;show()} }
function prev(){ if(i>0){i--;show()} }

/* ================= FIRMA ================= */
const canvas=document.getElementById('firma');
const ctx=canvas.getContext('2d');
let draw=false;
canvas.onmousedown=()=>{draw=true;ctx.beginPath()}
canvas.onmouseup=()=>draw=false;
canvas.onmousemove=e=>{
  if(draw){
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
  }
}

/* ================= FINALIZAR ================= */
function finalizar(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  /* LOGOS PDF */
  pdf.addImage("assets/logos/logo-itt-1878.png","PNG",80,5,50,20);
  pdf.addImage("assets/logos/logo-itt-cm93.png","PNG",10,5,30,15);

  pdf.setFontSize(14);
  pdf.text("PARTE DE SERVICIO – ITT 1878",105,35,{align:"center"});

  pdf.setFontSize(10);
  let y=50;

  const f=new FormData(document.getElementById("form"));
  const campo=(l,v)=>{pdf.text(`${l}: ${v||"-"}`,10,y);y+=8};

  campo("Operario",f.get("operario"));
  campo("Vehículo",f.get("vehiculo"));
  campo("Nº OT",f.get("ot"));
  campo("Fecha",f.get("fecha"));
  campo("Horas mano de obra",f.get("horas"));
  campo("Kilómetros",f.get("km"));

  y+=5;
  pdf.text("Trabajo realizado:",10,y); y+=6;
  pdf.text(f.get("trabajo")||"-",10,y,{maxWidth:190});

  y+=20;
  pdf.text("Materiales:",10,y); y+=6;
  pdf.text(f.get("materiales")||"-",10,y,{maxWidth:190});

  y+=20;
  pdf.text("Observaciones:",10,y); y+=6;
  pdf.text(f.get("obs")||"-",10,y,{maxWidth:190});

  pdf.addImage(canvas.toDataURL(),"PNG",10,240,60,30);
  pdf.text("Firma operario",10,235);

  const pdfBase64 = pdf.output("datauristring").split(",")[1];

  emailjs.send("service_k44yx7g","template_6i0hl7v",{
    to_email:"kevin.gancino@cm93.com",
    pdf_base64:pdfBase64,
    ot:f.get("ot"),
    operario:f.get("operario")
  }).then(()=>{
    alert("Parte enviado correctamente");
    location.reload();
  }).catch(e=>{
    console.error(e);
    alert("Error al enviar el parte");
  });
}
</script>

</body>
</html>
