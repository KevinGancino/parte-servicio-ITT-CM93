<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Parte de Servicio – ITT 1878</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Signature Pad -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>

<body
  class="min-h-screen bg-cover bg-center flex items-center justify-center"
  style="background-image: url('assets/bg/workshop.jpg');"
>

<div class="bg-white/95 rounded-xl shadow-2xl w-full max-w-md p-6">

  <!-- LOGOS -->
  <div class="flex justify-center items-center gap-4 mb-4 flex-wrap">
    <img src="assets/logos/logo-itt-cm93.png" class="h-10" alt="ITT CM93">
    <img src="assets/logos/logo-case.png" class="h-10" alt="CASE">
    <img src="assets/logos/logo-manitou.png" class="h-10" alt="MANITOU">
    <img src="assets/logos/logo-itt-1878.png" class="h-10" alt="ITT 1878">
  </div>

  <h1 class="text-center font-bold text-lg mb-4">Parte de Servicio – ITT 1878</h1>

  <!-- FORMULARIO MULTIPÁGINA -->
  <form id="formulario">

    <!-- PÁGINA 1 -->
    <div class="pagina">
      <label class="block mb-2">Operario *</label>
      <input required class="input" type="text">

      <label class="block mt-3 mb-2">Vehículo</label>
      <input class="input" type="text">

      <label class="block mt-3 mb-2">Nº OT *</label>
      <input required class="input" type="text">

      <label class="block mt-3 mb-2">Fecha *</label>
      <input required class="input" type="date">
    </div>

    <!-- PÁGINA 2 -->
    <div class="pagina hidden">
      <label class="block mb-2">Cliente *</label>
      <input required class="input" type="text">

      <label class="block mt-3 mb-2">Dirección *</label>
      <input required class="input" type="text">

      <label class="block mt-3 mb-2">Teléfono</label>
      <input class="input" type="text">

      <label class="block mt-3 mb-2">Email</label>
      <input class="input" type="email">
    </div>

    <!-- PÁGINA 3 -->
    <div class="pagina hidden">
      <label class="block mb-2">Marca *</label>
      <input required class="input" type="text">

      <label class="block mt-3 mb-2">Modelo *</label>
      <input required class="input" type="text">

      <label class="block mt-3 mb-2">Nº Serie *</label>
      <input required class="input" type="text">
    </div>

    <!-- PÁGINA 4 -->
    <div class="pagina hidden">
      <label class="block mb-2">Descripción del problema *</label>
      <textarea required class="input h-32"></textarea>
    </div>

    <!-- PÁGINA 5 – MANO DE OBRA -->
    <div class="pagina hidden">
      <label class="block mb-2">H. Salida</label>
      <select class="input"></select>

      <label class="block mt-3 mb-2">H. Llegada</label>
      <select class="input"></select>

      <label class="block mt-3 mb-2">Inicio trabajos *</label>
      <select required class="input"></select>

      <label class="block mt-3 mb-2">Fin trabajos *</label>
      <select required class="input"></select>

      <label class="block mt-3 mb-2">KM realizados</label>
      <input class="input" type="number">
    </div>

    <!-- PÁGINA 6 -->
    <div class="pagina hidden">
      <label class="block mb-2">Trabajos efectuados *</label>
      <textarea required class="input h-24"></textarea>

      <label class="block mt-3 mb-2">Materiales</label>
      <textarea class="input h-20"></textarea>

      <label class="block mt-3 mb-2">Observaciones</label>
      <textarea class="input h-20"></textarea>
    </div>

    <!-- PÁGINA 7 – FIRMAS -->
    <div class="pagina hidden">
      <p class="font-semibold mb-2">Firma Operario</p>
      <canvas id="firmaOperario" class="border w-full h-32 mb-4"></canvas>

      <p class="font-semibold mb-2">Firma Cliente</p>
      <canvas id="firmaCliente" class="border w-full h-32 mb-4"></canvas>

      <button type="button" onclick="generarPDF()" class="w-full bg-black text-white py-2 rounded">
        Enviar y generar parte de trabajo
      </button>
    </div>

  </form>

  <!-- NAVEGACIÓN -->
  <div class="flex justify-between mt-4">
    <button id="btnAtras" class="px-4 py-2 bg-gray-200 rounded">⬅ Atrás</button>
    <button id="btnSiguiente" class="px-4 py-2 bg-black text-white rounded">Siguiente ➡</button>
  </div>

</div>

<style>
  .input {
    width: 100%;
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 8px;
  }
</style>

<script>
  const paginas = document.querySelectorAll('.pagina');
  let actual = 0;

  function mostrarPagina() {
    paginas.forEach((p, i) => p.classList.toggle('hidden', i !== actual));
  }

  document.getElementById('btnSiguiente').onclick = () => {
    if (actual < paginas.length - 1) actual++;
    mostrarPagina();
  };

  document.getElementById('btnAtras').onclick = () => {
    if (actual > 0) actual--;
    mostrarPagina();
  };

  // Horarios
  document.querySelectorAll('select').forEach(sel => {
    for (let h = 6; h <= 20; h++) {
      ['00','30'].forEach(m => {
        const o = document.createElement('option');
        o.value = `${String(h).padStart(2,'0')}:${m}`;
        o.text = o.value;
        sel.appendChild(o);
      });
    }
  });

  // Firmas
  const firmaOp = new SignaturePad(document.getElementById('firmaOperario'));
  const firmaCl = new SignaturePad(document.getElementById('firmaCliente'));

  function generarPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    pdf.text("Parte de Servicio – ITT 1878", 10, 10);
    pdf.text("Documento generado correctamente", 10, 20);
    pdf.save("parte-servicio.pdf");
  }
</script>

</body>
</html>
