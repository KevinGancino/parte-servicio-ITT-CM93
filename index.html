<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parte de Servicio – ITT 1878</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  background:url('assets/bg/workshop.jpg') center/cover fixed no-repeat;
}
.page{display:none}
.page.active{display:block}
label{font-weight:600;font-size:0.9rem}
.input{
  width:100%;
  border:1px solid #ccc;
  padding:8px;
  border-radius:6px;
}
</style>
</head>

<body class="min-h-screen flex justify-center items-center">

<div class="bg-white/95 w-full max-w-xl p-6 rounded-xl shadow-xl">

<!-- LOGOS -->
<div class="text-center mb-4">
  <img src="assets/logos/logo-itt-1878.png" class="h-14 mx-auto mb-2">
  <div class="flex justify-center gap-4">
    <img src="assets/logos/logo-itt-cm93.png" class="h-8">
    <img src="assets/logos/logo-case.jfif" class="h-8">
    <img src="assets/logos/logo-manitou.png" class="h-8">
  </div>
</div>

<h2 class="text-center font-bold text-lg mb-4">Parte de Servicio – ITT 1878</h2>

<form id="form">

<!-- PÁGINA 1 -->
<div class="page active">
  <label>Operario *</label>
  <input name="operario" class="input">

  <label class="mt-2 block">Vehículo</label>
  <input name="vehiculo" class="input">

  <label class="mt-2 block">Nº OT *</label>
  <input name="ot" class="input">

  <label class="mt-2 block">Fecha *</label>
  <input type="date" name="fecha" class="input">
</div>

<!-- PÁGINA 2 -->
<div class="page">
  <label>Cliente *</label>
  <input name="cliente" class="input">

  <label class="mt-2 block">Dirección</label>
  <input name="direccion" class="input">

  <label class="mt-2 block">Teléfono</label>
  <input name="telefono" class="input">

  <label class="mt-2 block">Email</label>
  <input type="email" name="email" class="input">
</div>

<!-- PÁGINA 3 -->
<div class="page">
  <label>Marca *</label>
  <input name="marca" class="input">

  <label class="mt-2 block">Modelo *</label>
  <input name="modelo" class="input">

  <label class="mt-2 block">Nº Serie *</label>
  <input name="serie" class="input">

  <label class="mt-2 block">Horas máquina</label>
  <input name="horas_maquina" class="input">
</div>

<!-- PÁGINA 4 -->
<div class="page">
  <label>Motivo del aviso</label>
  <input name="motivo" class="input">

  <label class="mt-2 block">Descripción del problema</label>
  <textarea name="problema" class="input h-28"></textarea>
</div>

<!-- PÁGINA 5 -->
<div class="page">
  <label>Hora salida *</label>
  <select name="hora_salida" class="input">
    <option value="">Seleccionar</option>
    ${Array.from({length:15},(_,i)=>`<option>${String(i+6).padStart(2,'0')}:00</option>`).join('')}
  </select>

  <label class="mt-2 block">Hora llegada *</label>
  <select name="hora_llegada" class="input">
    <option value="">Seleccionar</option>
    ${Array.from({length:15},(_,i)=>`<option>${String(i+6).padStart(2,'0')}:00</option>`).join('')}
  </select>

  <label class="mt-2 block">Horas de trabajo *</label>
  <input name="horas_trabajo" class="input">

  <label class="mt-2 block">Kilómetros realizados *</label>
  <input name="km" class="input">
</div>

<!-- PÁGINA 6 -->
<div class="page">
  <label>Trabajos realizados</label>
  <textarea name="trabajos" class="input h-24"></textarea>

  <label class="mt-2 block">Materiales utilizados</label>
  <textarea name="materiales" class="input h-24"></textarea>

  <label class="mt-2 block">Observaciones</label>
  <textarea name="observaciones" class="input h-24"></textarea>
</div>

<!-- PÁGINA 7 -->
<div class="page">
  <label>Firma operario</label>
  <canvas id="firmaOperario" class="border w-full h-28 mb-4"></canvas>

  <label>Firma cliente</label>
  <canvas id="firmaCliente" class="border w-full h-28"></canvas>

  <button type="button" onclick="finalizar()" class="w-full bg-black text-white py-2 rounded mt-4">
    Generar PDF y Enviar
  </button>
</div>

<div class="flex justify-between mt-4">
  <button type="button" onclick="prev()" class="px-4 py-2 bg-gray-200 rounded">Atrás</button>
  <button type="button" onclick="next()" class="px-4 py-2 bg-black text-white rounded">Siguiente</button>
</div>

</form>
</div>

<script>
emailjs.init("YUPi8RN6-nphAC3p-");

const pages=document.querySelectorAll('.page');
let i=0;
function show(){pages.forEach(p=>p.classList.remove('active'));pages[i].classList.add('active')}
function next(){if(i<pages.length-1){i++;show()}}
function prev(){if(i>0){i--;show()}}

function setupCanvas(id){
  const c=document.getElementById(id);
  const ctx=c.getContext('2d');
  let d=false;
  c.onmousedown=()=>{d=true;ctx.beginPath()}
  c.onmouseup=()=>d=false
  c.onmousemove=e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}}
  return c;
}

const firmaOp=setupCanvas("firmaOperario");
const firmaCl=setupCanvas("firmaCliente");

function finalizar(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  pdf.addImage("assets/logos/logo-itt-1878.png","PNG",70,5,60,20);
  pdf.addImage("assets/logos/logo-itt-cm93.png","PNG",20,30,30,12);
  pdf.addImage("assets/logos/logo-case.jfif","JPEG",70,30,30,12);
  pdf.addImage("assets/logos/logo-manitou.png","PNG",120,30,30,12);

  pdf.text("PARTE DE SERVICIO – ITT 1878",40,50);

  let y=60;
  new FormData(form).forEach((v,k)=>{
    pdf.text(`${k.toUpperCase()}: ${v}`,10,y);
    y+=7;
  });

  pdf.text("Firma operario:",10,y+5);
  pdf.addImage(firmaOp.toDataURL(),"PNG",10,y+10,60,25);

  pdf.text("Firma cliente:",110,y+5);
  pdf.addImage(firmaCl.toDataURL(),"PNG",110,y+10,60,25);

  const blob=pdf.output("blob");

  emailjs.send("service_k44yx7g","template_6i0hl7v",{
    to_email:"kevin.gancino@cm93.com",
    message:"Parte de servicio adjunto"
  },{attachments:[{name:"parte-servicio.pdf",blob}]});

  pdf.save("parte-servicio.pdf");
  alert("Parte generado y enviado correctamente");
}
</script>

</body>
</html>
