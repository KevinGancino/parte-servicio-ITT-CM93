<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ITT 1878 · Parte de Servicio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .pagina { display: none; }
    .pagina.activa { display: block; }
    canvas { border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>

<body class="min-h-screen bg-cover bg-center flex justify-center items-center"
      style="background-image:url('assets/bg/workshop.jpg')">

<div class="bg-white/95 w-full max-w-md p-6 rounded-xl shadow-xl">

  <!-- LOGOS -->
  <div class="flex flex-col items-center gap-3 mb-4">
    <img src="assets/logos/logo-itt-1878.png" class="h-14">
    <div class="flex gap-4">
      <img src="assets/logos/logo-itt-cm93.png" class="h-10">
      <img src="assets/logos/logo-case.png" class="h-10">
      <img src="assets/logos/logo-manitou.png" class="h-10">
    </div>
  </div>

  <h1 class="text-center font-semibold mb-4">Parte de Servicio – ITT 1878</h1>

  <!-- PÁGINA 1 -->
  <div class="pagina activa">
    <input id="operario" placeholder="Operario *" class="w-full border p-2 mb-2">
    <input id="vehiculo" placeholder="Vehículo" class="w-full border p-2 mb-2">
    <input id="ot" placeholder="Nº OT *" class="w-full border p-2 mb-2">
    <input id="fecha" type="date" class="w-full border p-2 mb-4">
    <button onclick="siguiente()" class="w-full bg-black text-white py-2 rounded">Siguiente</button>
  </div>

  <!-- PÁGINA 2 -->
  <div class="pagina">
    <input id="cliente" placeholder="Cliente *" class="w-full border p-2 mb-2">
    <input id="poblacion" placeholder="Población *" class="w-full border p-2 mb-4">
    <button onclick="anterior()" class="w-full mb-2 bg-gray-200 py-2 rounded">Atrás</button>
    <button onclick="siguiente()" class="w-full bg-black text-white py-2 rounded">Siguiente</button>
  </div>

  <!-- PÁGINA 3 -->
  <div class="pagina">
    <textarea id="problema" placeholder="Descripción del problema *" class="w-full border p-2 mb-4"></textarea>
    <button onclick="anterior()" class="w-full mb-2 bg-gray-200 py-2 rounded">Atrás</button>
    <button onclick="siguiente()" class="w-full bg-black text-white py-2 rounded">Siguiente</button>
  </div>

  <!-- PÁGINA 4 -->
  <div class="pagina">
    <textarea id="trabajos" placeholder="Trabajos efectuados" class="w-full border p-2 mb-2"></textarea>
    <textarea id="materiales" placeholder="Materiales" class="w-full border p-2 mb-2"></textarea>
    <textarea id="observaciones" placeholder="Observaciones" class="w-full border p-2 mb-4"></textarea>
    <button onclick="anterior()" class="w-full mb-2 bg-gray-200 py-2 rounded">Atrás</button>
    <button onclick="siguiente()" class="w-full bg-black text-white py-2 rounded">Siguiente</button>
  </div>

  <!-- PÁGINA 5 -->
  <div class="pagina">
    <p class="text-sm mb-1">Firma Operario</p>
    <canvas id="firmaOperario" width="280" height="80"></canvas>

    <p class="text-sm mt-3 mb-1">Firma Cliente</p>
    <canvas id="firmaCliente" width="280" height="80"></canvas>

    <button onclick="generarPDF()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">
      Enviar y generar parte
    </button>

    <button onclick="anterior()" class="w-full mt-2 bg-gray-200 py-2 rounded">Atrás</button>
  </div>

</div>

<script>
let pagina = 0;
const paginas = document.querySelectorAll('.pagina');

function mostrar() {
  paginas.forEach(p => p.classList.remove('activa'));
  paginas[pagina].classList.add('activa');
}
function siguiente(){ pagina++; mostrar(); }
function anterior(){ pagina--; mostrar(); }

/* FIRMAS */
function activarFirma(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  let dibujando = false;
  canvas.onmousedown = () => dibujando = true;
  canvas.onmouseup = () => dibujando = false;
  canvas.onmousemove = e => {
    if(!dibujando) return;
    ctx.lineWidth = 2;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  }
}
activarFirma("firmaOperario");
activarFirma("firmaCliente");

/* PDF */
async function generarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // LOGOS
  doc.addImage("assets/logos/logo-itt-1878.png","PNG",15,10,40,15);
  doc.addImage("assets/logos/logo-itt-cm93.png","PNG",60,12,30,10);
  doc.addImage("assets/logos/logo-case.png","PNG",95,12,30,10);
  doc.addImage("assets/logos/logo-manitou.png","PNG",130,12,30,10);

  doc.setFontSize(14);
  doc.text("PARTE DE SERVICIO – ITT 1878", 105, 35, {align:"center"});

  doc.autoTable({
    startY: 40,
    theme: 'grid',
    body: [
      ["Operario", operario.value, "Vehículo", vehiculo.value],
      ["Nº OT", ot.value, "Fecha", fecha.value],
      ["Cliente", cliente.value, "Población", poblacion.value],
    ]
  });

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 5,
    theme: 'grid',
    body: [
      ["DESCRIPCIÓN DEL PROBLEMA"],
      [problema.value]
    ]
  });

  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 5,
    theme: 'grid',
    body: [
      ["TRABAJOS EFECTUADOS"],
      [trabajos.value],
      ["MATERIALES"],
      [materiales.value],
      ["OBSERVACIONES"],
      [observaciones.value]
    ]
  });

  // FIRMAS
  doc.addImage(firmaOperario.toDataURL(),"PNG",30,doc.lastAutoTable.finalY+10,60,25);
  doc.addImage(firmaCliente.toDataURL(),"PNG",120,doc.lastAutoTable.finalY+10,60,25);

  doc.text("Firma Operario", 45, doc.lastAutoTable.finalY+38);
  doc.text("Firma Cliente", 140, doc.lastAutoTable.finalY+38);

  doc.save(`Parte_${ot.value}.pdf`);
}
</script>

</body>
</html>
